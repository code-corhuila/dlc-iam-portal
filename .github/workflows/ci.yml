name: CI
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skeleton-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:skeleton
      - run: npm ci
      - run: npm test
      - run: npx ng run dlc-iam-portal:build-original:production
      - run: if grep -R -q -E 'StrongPass1|staff@example.test' dist/dlc-iam-portal/browser; then echo "Fake login found in production bundle"; exit 1; fi
