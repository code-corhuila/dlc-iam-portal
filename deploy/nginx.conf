server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  location ^~ /portals/iam/ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
